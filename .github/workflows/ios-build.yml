name: Build iOS App

on:
  push:
    branches: [ "main", "master", "fix/ios-clean" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup iOS Platform
        run: |
          cd frontend
          rm -rf ios
          
          # On crée d'abord le dossier ios via une commande qui ne bloque pas ou on gère l'erreur du pod install auto
          # Alternative : npx cap add ios lance pod install qui échoue. On peut autoriser l'échec pour corriger juste après.
          npx cap add ios || true
          
          # Maintenant que le Podfile existe (même si le pod install a échoué), on force la version à 16.0 (ou 17.0 si nécessaire)
          python3 - << 'EOF'
          import re
          path = 'ios/App/Podfile'
          try:
              with open(path, 'r') as f:
                  content = f.read()
              # Remplacement de la version cible par 17.0 pour être sûr de couvrir les dernières versions de Capacitor
              new_content = re.sub(r"platform\s+:ios,\s*['\"].*?['\"]", "platform :ios, '17.0'", content)
              with open(path, 'w') as f:
                  f.write(new_content)
          except FileNotFoundError:
              print("Podfile non trouvé")
          EOF
          
          # On lance ensuite un vrai pod install propre avec la bonne version
          cd ios/App
          pod install --repo-update
          cd ../..
          
          # Copie des assets web
          npx cap copy ios



      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
