name: Build iOS App

on:
  push:
    branches: [ "main", "master", "fix/ios-clean" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup iOS Platform
        run: |
          cd frontend
          rm -rf ios
          npx cap add ios || true
          
          # 1. Forcer la cible iOS à 16.0 dans le pbxproj
          python3 - << 'EOF'
          import re
          pbxproj_path = 'ios/App/App.xcodeproj/project.pbxproj'
          try:
              with open(pbxproj_path, 'r') as f:
                  content = f.read()
              new_content = re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = 1[2-4]\.\d;', 'IPHONEOS_DEPLOYMENT_TARGET = 16.0;', content)
              with open(pbxproj_path, 'w') as f:
                  f.write(new_content)
          except Exception as e:
              print(e)
          EOF
          
          # 2. Injecter un Podfile blindé
          cat << 'EOF' > ios/App/Podfile
          require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

          platform :ios, '16.0'
          use_frameworks!

          install! 'cocoapods', :disable_input_output_paths => true

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end

          post_install do |installer|
            assertDeploymentTarget(installer)
            installer.generated_projects.each do |project|
              project.targets.each do |target|
                target.build_configurations.each do |config|
                  config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '16.0'
                end
              end
            end
          end
          EOF
          
          cd ios/App
          pod install --repo-update
          cd ../..
          npx cap copy ios

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          # On compile en Release
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -derivedDataPath Build
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-artifact
          path: frontend/ios/App/Build/Build/Products/Release-iphonesimulator/
