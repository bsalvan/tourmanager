name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup iOS Platform
        run: |
          cd frontend
          # Nettoyer l'ancien dossier ios pour éviter le conflit "already exists"
          rm -rf ios
          npx cap add ios
          
          # Forcer la cible iOS à 15.0 (requis par les versions récentes de Capacitor)
          node -e "
            const fs = require('fs');
            const p = 'ios/App/Podfile';
            let content = fs.readFileSync(p, 'utf8');
            content = content.replace(/platform\s+:ios,\s*['\"].*['\"]/, \"platform :ios, '15.0'\");
            fs.writeFileSync(p, content, 'utf8');
          "
          
          # Mettre à jour les pods avec --repo-update
          cd ios/App
          pod install --repo-update
          cd ../..
          
          # Copier les assets web
          npx cap copy ios

          # Copier les assets web
          npx cap copy ios

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
