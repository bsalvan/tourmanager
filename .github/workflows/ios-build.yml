name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup iOS Platform
        run: |
          cd frontend
          rm -rf ios
          npx cap add ios
          
          # Modification propre de la version iOS dans le Podfile existant
          python3 -c "import re; p='ios/App/Podfile'; c=open(p).read(); open(p,'w').write(re.sub(r'platform\s+:ios,\s*[\'\()].*?[\'\)]', \"platform :ios, '15.0'\", c))"
          
          # Installation des pods et copie des assets
          cd ios/App
          pod install --repo-update
          cd ../..
          npx cap copy ios

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
