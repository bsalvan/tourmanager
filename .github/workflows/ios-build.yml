name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Add iOS platform if missing
        run: |
          cd frontend
          npx cap add ios || true
          # Forcer la cible iOS à 14.0 minimum pour Capacitor 7
          sed -i '' "s/platform :ios, '.*'/platform :ios, '14.0'/" ios/App/Podfile
          
          # Mettre à jour les pods avec --repo-update pour éviter l'erreur de version
          cd ios/App
          pod install --repo-update
          cd ../..
          
          # Copier uniquement les assets web (évite de relancer un pod install par défaut)
          npx cap copy ios

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
