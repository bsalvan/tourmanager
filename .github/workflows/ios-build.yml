name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup iOS Platform
        run: |
          cd frontend
          # Nettoyer l'ancien dossier ios pour repartir sur du propre
          rm -rf ios
          npx cap add ios
          
          # Remplacer complètement le Podfile par une version blindée et compatible
          node -e "
            const fs = require('fs');
            const podfilePath = 'ios/App/Podfile';
            const content = \`require_relative '../../node_modules/@capacitor/ios/scripts/pods_helpers'

platform :ios, '15.0'
use_frameworks!

install! 'cocoapods', :disable_input_output_paths => true

def capacitor_pods
  pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
  pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
end

target 'App' do
  capacitor_pods
end

post_install do |installer|
  assertDeploymentTarget(installer)
  installer.generated_projects.each do |project|
    project.targets.each do |target|
      target.build_configurations.each do |config|
        config.build_settings['IPHONEOS_DEPLOYMENT_TARGET'] = '15.0'
      end
    end
  end
end
\`;
            fs.writeFileSync(podfilePath, content, 'utf8');
          "
          
          # Lancer l'installation des pods avec mise à jour du dépôt
          cd ios/App
          pod install --repo-update
          cd ../..
          
          # Copier les assets web
          npx cap copy ios

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
