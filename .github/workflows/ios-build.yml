name: Build iOS App

on:
  push:
    branches: [ "main", "master", "fix/ios-clean" ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies & Build Web
        run: |
          cd frontend
          npm install
          npm run build

      - name: Setup iOS Platform
        run: |
          cd frontend
          rm -rf ios
          npx cap add ios || true
          
          # Forcer la version cible à 17.0
          python3 - << 'EOF'
          import re
          path = 'ios/App/Podfile'
          try:
              with open(path, 'r') as f:
                  content = f.read()
              new_content = re.sub(r"platform\s+:ios,\s*['\"].*?['\"]", "platform :ios, '17.0'", content)
              with open(path, 'w') as f:
                  f.write(new_content)
          except FileNotFoundError:
              pass
          EOF
          
          # Installer les pods DANS le dossier ios/App
          cd ios/App
          pod install --repo-update
          cd ../..
          
          npx cap copy ios

      - name: Build iOS App
        run: |
          cd frontend/ios/App
          # On s'assure d'utiliser le workspace généré par CocoaPods
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
